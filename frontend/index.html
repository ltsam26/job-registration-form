<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Job Registration</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Job Registration Form</h1>

        <form id="jobForm">

            <!-- Full Name -->

            <label for="name">
                Full Name *
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >

            <!-- Phone Number -->


     <label for="phone">Phone Number *</label>

            <input
    type="tel"
    id="phone"
    placeholder="Enter your phone number"
    pattern="[0-9]{10}"
    maxlength="10"
    required
>


            <!-- Email -->

            <label for="email">
                Email Address *
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <!-- Address -->

            <label for="address">
                Address *
            </label>

            <textarea
                id="address"
                placeholder="Enter your address"
                required
            ></textarea>


            <!-- Department -->

            <label for="department">
                Department *
            </label>

            <select id="department" required>

                <option value="">
                    Select Department
                </option>

                <option value="Sales">
                    Sales
                </option>

                <option value="Marketing">
                    Marketing
                </option>

                <option value="Human Resources">
                    Human Resources
                </option>

                <option value="Finance">
                    Finance
                </option>

                <option value="IT">
                    IT / Technology
                </option>

                <option value="Operations">
                    Operations
                </option>

                <option value="Customer Support">
                    Customer Support
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <!-- Experience -->

            <label>
                Fresher / Experience *
            </label>

            <div class="radio-group">

                <label>
                    <input
                        type="radio"
                        name="experienceType"
                        value="Fresher"
                        required
                    >

                    Fresher
                </label>

                <label>
                    <input
                        type="radio"
                        name="experienceType"
                        value="Experienced"
                    >

                    Experienced
                </label>

            </div>

            <!-- Resume URL -->

            <label for="resume">Resume URL *</label>
<input
    type="url"
    id="resume"
    placeholder="https://drive.google.com/your-resume"
    required
>



            <!-- LinkedIn -->

            <label for="linkedin">
                LinkedIn Profile
            </label>

            <input
                type="url"
                id="linkedin"
                placeholder="https://linkedin.com/in/yourname"
            >


            <!-- Submit -->

            <button type="submit">
                SUBMIT
            </button>

        </form>

        <p id="message"></p>

    </div>

    <script src="script.js"></script>

</body>

</html>
